<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Logowanie</title>
<style>body { margin: 0; background: rgb(30, 60, 200); color: #fff; font: 16px sans-serif; }</style>
<script>
  // Logged in already: the real panel leaves its login page, so only a logged-out context shows it.
  if (document.cookie.includes('sid=ok')) location.replace('dashboard.html');
</script>
</head>
<body>
<h1>Logowanie</h1>
<form action="login.html" method="post">
  <input name="user" aria-label="E-mail">
  <input type="password" name="pass" aria-label="Hasło">
  <button>Zaloguj</button>
</form>
<script>
  // A load-time write: the fresh tab is guarded like any other, so it never arrives.
  fetch('/api/login-beacon', { method: 'POST' }).catch(() => {});
</script>
</body>
</html>
