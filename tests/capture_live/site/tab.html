<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Nowa karta</title>
<style>
  /* Green background: a screenshot of this tab is told apart from the opener by colour alone. */
  body { font: 16px sans-serif; color: #fff; background: rgb(20, 140, 60); margin: 40px; }
  button { display: inline-block; margin: 8px; padding: 10px 18px; background: #2a5d9f; color: #fff;
    border: 0; border-radius: 6px; font-size: 16px; }
  #code { display: none; }
</style>
</head>
<body>
<h1>Nowa karta</h1>
<p><button type="button" id="show">Pokaż kod</button></p>
<p id="code">Kod widoczny</p>
<p><button type="button" id="save">Zapisz w karcie</button> <button type="button" id="pay">Zapłać w karcie</button></p>
<form id="form" method="post" action="/tab-form">
  <input type="hidden" name="n" value="abc">
  <button type="button" id="scripted">Wyślij skryptem</button>
</form>
<script>
  document.getElementById('show').addEventListener('click', () => {
    document.getElementById('code').style.display = 'block';
  });
  const post = (path) => fetch(path, { method: 'POST', body: '{}' });
  document.getElementById('save').addEventListener('click', () => post('/api/tab'));
  document.getElementById('pay').addEventListener('click', () => post('/api/tab-pay'));
  document.getElementById('scripted').addEventListener('click', () => document.getElementById('form').submit());
</script>
</body>
</html>
