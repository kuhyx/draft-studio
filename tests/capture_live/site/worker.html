<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wątki</title>
<style>
  body { font: 16px sans-serif; margin: 40px; }
  button { padding: 10px 18px; font-size: 16px; }
</style>
</head>
<body>
<!-- Dedicated workers attach as their own "worker" targets, which have no Fetch domain
     (Google Maps runs them). One starts on load and tries to POST; one starts on a click. -->
<h1>Wątki</h1>
<p><button type="button" id="start">Uruchom wątek</button></p>
<p id="load"></p>
<p id="click"></p>
<script>
  const run = (id, mode) => {
    const worker = new Worker(`worker.js?${mode}`);
    worker.onmessage = (event) => { document.getElementById(id).textContent = event.data; };
  };
  run('load', 'post');
  // worker.html?save: the click's worker POSTs instead of reading (the permission-card case).
  const mode = location.search === '?save' ? 'save' : 'get';
  document.getElementById('start').addEventListener('click', () => run('click', mode));
</script>
</body>
</html>
